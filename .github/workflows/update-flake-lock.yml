name: Update flake.lock

# Dependabot has no Nix ecosystem, so flake.lock updates are handled by
# this scheduled workflow instead of Dependabot. It opens a pull
# request roughly every 3 days; the required ci-lint checks still gate
# merging.
#
# Two things to know about the PRs this workflow opens:
# - GitHub does not run workflows on PRs opened with the default
#   GITHUB_TOKEN, and the commits are unsigned (Muse's signing key
#   lives only on Muse's VM, never in CI). Both are resolved the same
#   way: Muse rebases the branch locally, re-signs the commits, and
#   pushes, which also triggers ci-lint. (The flake/Dependabot split
#   is also documented in .github/dependabot.yml and the README.)

on:
  schedule:
    # Roughly every 3 days at 03:17 JST (18:17 UTC the previous day).
    - cron: "17 18 */3 * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  update-flake-lock:
    name: update-flake-lock
    runs-on: ubuntu-24.04
    permissions:
      # The update action commits the refreshed flake.lock to its PR branch.
      contents: write
      # The update action opens (and refreshes) the flake.lock PR.
      pull-requests: write
    timeout-minutes: 20
    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        timeout-minutes: 5
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Update flake.lock
        timeout-minutes: 10
        uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        with:
          commit-msg: "chore: update flake.lock"
          pr-title: "chore: update flake.lock"
          pr-labels: |
            dependencies
            automated
