# Dependabot: keep dependencies current, with every ecosystem grouped
# into a single pull request so updates arrive as one reviewable change
# per ecosystem instead of a stream of separate PRs.
#
# Cadence: Dependabot's finest schedule interval is daily, so the
# "every few days" feel is created with cooldown: versions younger
# than 3 days are never proposed, and semver-major bumps wait 7 days
# where the ecosystem supports it (npm only — Dependabot rejects
# semver-* cooldown options for github-actions, and one unsupported
# property invalidates the whole file).
#
# Nix note: Dependabot has no Nix ecosystem. flake.lock updates are
# handled by the scheduled update-flake-lock workflow instead
# (.github/workflows/update-flake-lock.yml).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Tokyo"
    # No semver-major-days here: Dependabot does not support semver-*
    # cooldown options for github-actions, and the unsupported property
    # invalidates the entire file.
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - "*"

  # Node dependencies are managed with pnpm. Dependabot tracks pnpm
  # projects through the "npm" ecosystem; this entry covers the Alchemy
  # program in infra/ (and gets the same cooldown + grouping).
  - package-ecosystem: "npm"
    directory: "/infra"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      npm:
        patterns:
          - "*"
